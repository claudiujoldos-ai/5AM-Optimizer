name: Build si release

# Publicare automata: cand pe main ajunge o versiune noua in 5AMOptimizer.ps1
# (linia $AppVersion = 'x.y.z'), se construieste exe-ul si se publica release-ul vx.y.z.
# Daca versiunea exista deja ca release, doar se construieste si se testeaza (fara publicare).
on:
  push:
    branches: [main]
    paths:
      - '5AMOptimizer.ps1'
      - 'RELEASE_NOTES.md'
      - 'assets/**'
      - 'lang/**'
      - '.github/workflows/build.yml'
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Versiune si verificare release existent
        id: ver
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ('${{ github.ref }}' -like 'refs/tags/v*') {
            # tag pus manual: versiunea vine din tag si se scrie in script
            $ver = '${{ github.ref_name }}'.TrimStart('v')
            $out = Get-Content .\5AMOptimizer.ps1 | ForEach-Object {
              if ($_ -like '$AppVersion = *') { "`$AppVersion = '$ver'" } else { $_ }
            }
            Set-Content .\5AMOptimizer.ps1 $out -Encoding UTF8
          } else {
            $line = Select-String -Path .\5AMOptimizer.ps1 -Pattern "^\`$AppVersion = '([0-9]+(\.[0-9]+){1,3})'" | Select-Object -First 1
            if (-not $line) { throw 'Nu gasesc linia $AppVersion in 5AMOptimizer.ps1' }
            $ver = $line.Matches[0].Groups[1].Value
          }
          # prin cmd, ca mesajul de eroare "release not found" sa nu opreasca pasul
          cmd /c "gh release view v$ver -R ${{ github.repository }} >nul 2>&1"
          $exists = ($LASTEXITCODE -eq 0)
          $global:LASTEXITCODE = 0
          $publish = (-not $exists) -and ('${{ github.event_name }}' -ne 'workflow_dispatch')
          "Versiune: $ver   release existent: $exists   se publica: $publish"
          "version=$ver" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          "publish=$($publish.ToString().ToLower())" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT

      - name: Incorporeaza iconitele 3D
        shell: powershell
        run: |
          $files = @(Get-ChildItem .\assets\icons\*.png)
          if ($files.Count -lt 60) { throw "Prea putine iconite in assets\icons: $($files.Count)" }
          $lines = foreach ($f in $files) { "    '$($f.BaseName)' = '$([Convert]::ToBase64String([IO.File]::ReadAllBytes($f.FullName)))'" }
          $src = @(Get-Content .\5AMOptimizer.ps1)
          $i = [array]::IndexOf($src, '$script:iconPack = @{}')
          if ($i -lt 1) { throw 'Nu gasesc linia $script:iconPack in script' }
          $new = @($src[0..($i - 1)]) + '$script:iconPack = @{' + @($lines) + '}' + @($src[($i + 1)..($src.Count - 1)])
          Set-Content .\5AMOptimizer.ps1 $new -Encoding UTF8
          "Iconite incorporate: $($files.Count)"

      - name: Incorporeaza traducerea in engleza
        shell: powershell
        run: |
          $json = [IO.File]::ReadAllText((Resolve-Path .\lang\en.json))
          $null = $json | ConvertFrom-Json
          $src = @(Get-Content .\5AMOptimizer.ps1)
          $i = [array]::IndexOf($src, "`$script:langPack = ''")
          if ($i -lt 1) { throw 'Nu gasesc linia $script:langPack in script' }
          $new = @($src[0..($i - 1)]) + "`$script:langPack = @'" + @($json -split "`r?`n") + "'@" + @($src[($i + 1)..($src.Count - 1)])
          Set-Content .\5AMOptimizer.ps1 $new -Encoding UTF8
          "Traducere incorporata: $($json.Length) caractere"

      - name: Auto-test (script)
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -STA -File .\5AMOptimizer.ps1 -SelfTest
          $code = $LASTEXITCODE
          $out = @(Get-Content "$env:TEMP\5am_selftest.txt" -ErrorAction SilentlyContinue)
          $out
          if ($code -ne 0) {
            foreach ($l in $out) { Write-Output "::error title=SelfTest::$l" }
            if (-not $out.Count) { Write-Output "::error title=SelfTest::fara fisier de rezultat (cod $code)" }
            throw "SelfTest a esuat (cod $code)"
          }

      - name: Instaleaza ps2exe
        shell: powershell
        run: Install-Module ps2exe -Scope CurrentUser -Force

      - name: Compileaza .exe
        shell: powershell
        run: |
          $ver = '${{ steps.ver.outputs.version }}'
          $v4 = ($ver + '.0.0.0').Split('.')[0..3] -join '.'
          Invoke-ps2exe -inputFile .\5AMOptimizer.ps1 -outputFile .\5AMOptimizer.exe `
            -noConsole -requireAdmin -STA -iconFile .\assets\icon.ico `
            -title '5AM Optimizer' -product '5AM Optimizer' -company '5AM' -version $v4 `
            -description 'Optimizari Windows pentru gaming'
          if (-not (Test-Path .\5AMOptimizer.exe)) { throw 'Compilarea a esuat' }
          Get-Item .\5AMOptimizer.exe | Select-Object Name, Length

      - name: Test .exe compilat
        shell: powershell
        run: |
          Remove-Item "$env:TEMP\5am_selftest.txt" -ErrorAction SilentlyContinue
          $p = Start-Process .\5AMOptimizer.exe -ArgumentList '-SelfTest' -PassThru
          $done = $p.WaitForExit(90000)
          if (Test-Path "$env:TEMP\5am_selftest.txt") { Get-Content "$env:TEMP\5am_selftest.txt" } else { 'Nu exista fisier de rezultat' }
          if (-not $done) { try { $p.Kill() } catch {}; throw 'Testul exe nu s-a terminat in 90 secunde' }
          if ($p.ExitCode -ne 0) { throw "Testul exe a esuat (cod $($p.ExitCode))" }

      - name: Suma de control SHA256
        shell: powershell
        run: |
          $h = (Get-FileHash .\5AMOptimizer.exe -Algorithm SHA256).Hash.ToLower()
          "$h  5AMOptimizer.exe" | Out-File -Encoding ascii .\5AMOptimizer.exe.sha256
          Get-Content .\5AMOptimizer.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: 5AMOptimizer
          path: |
            5AMOptimizer.exe
            5AMOptimizer.exe.sha256

      - name: Publica release
        if: steps.ver.outputs.publish == 'true' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            5AMOptimizer.exe
            5AMOptimizer.exe.sha256
          body_path: RELEASE_NOTES.md
